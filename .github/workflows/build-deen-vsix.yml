name: Build deen Extension for Visual Studio Code

on:
  workflow_dispatch

jobs:

  build:
    name: Build deen extension
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v5
      with:
        go-version: ^1.26
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "22.x"
        cache: npm
        cache-dependency-path: extras/vscode-deen/package-lock.json

    - name: Get dependencies
      run: go mod download

    - name: Build vsix package
      run: |
        cd extras/vscode-deen
        npm ci
        npm exec -- @vscode/vsce package

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
          name: vscode-deen
          path: extras/vscode-deen/deen-*.vsix
