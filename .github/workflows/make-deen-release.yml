name: Make deen Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

jobs:
  build:
    name: Build and publish CLI release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${DISPATCH_TAG:-$REF_NAME}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $version" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.version }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test -mod=readonly ./...

      - name: Build release binaries
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: make cross-stripped VERSION="$VERSION" BRANCH=

      - name: Verify release binaries
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test "$(bin/linux-amd64/deen -version)" = "$VERSION"
          test "$(printf test | bin/linux-amd64/deen base64)" = "dGVzdA=="

      - name: Package release binaries and checksums
        run: |
          mkdir -p release
          for directory in bin/*/; do
            platform=$(basename "$directory")
            if [ -f "${directory}deen.exe" ]; then
              cp "${directory}deen.exe" "release/deen-${platform}.exe"
            elif [ -f "${directory}deen" ]; then
              cp "${directory}deen" "release/deen-${platform}"
            fi
          done
          chmod +x release/deen-*
          cd release
          sha256sum deen-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.version }}
          name: Release ${{ steps.release.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease }}
          files: release/*
